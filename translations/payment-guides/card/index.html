<h1 id="card-payments">什么是卡片支付</h1>

<p>卡片支付是一项可以使用带有国际卡组织标识的信用卡、借记卡和预付卡支付商品或服务费用的服务。</p>

<p>信用卡公司会代替购买者向其购物的店铺支付款项，再向购买者收取费用。<br>

fincode 支持以下国际卡组织：<br>

<code>VISA（维萨）</code>、<code>Mastercard（万事达卡）</code>、<code>JCB</code>、<code>American Express（美国运通）</code>、<code>Diners Club（大来卡）</code>、<code>Discover（发现卡）</code></p>

<div class="custom-block-common custom-block">

<div class="custom-block-title-common custom-block-title">使用本服务需要与信用卡公司签约并通过审核。</div>

</div>
