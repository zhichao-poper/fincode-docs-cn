<h1 id="バイヤー新規ユーザー登録">买家新用户注册</h1>
<p>打开新用户注册界面后，输入姓名、电子邮箱和密码，点击「新用户注册」。进入「双因素认证 · 认证应用设置」后，请使用 Google Authenticator、Microsoft Authenticator 等认证应用扫描二维码，或输入认证码。</p>
<p><a href="/develop_support/two_factor_authentication">双因素认证设置步骤</a><br>
※ 登录控制面板需要完成双因素认证和电子邮箱验证。</p>
<p>点击收到的邮件正文中的链接，在管理界面输入注册新用户时设置的密码，即完成电子邮箱验证。</p>
<p>已完成商户登记的用户，请使用登记的电子邮箱和密码登录管理界面。</p>
