<h1 id="プラットフォームを開設する">开设平台</h1>
<p>使用平台功能前，请以平台类型注册新用户。<br>
测试环境和生产环境均须进行此操作。</p>
<p><i class="icon-after icon-window"><a href="https://dashboard.test.fincode.jp/sign_up" rel="[&#x27;nofollow&#x27;, &#x27;noopener&#x27;, &#x27;noreferrer&#x27;]" target="_blank">注册 fincode 新用户</a></i></p>
<p>打开控制面板的新用户注册页面后，输入姓名、电子邮件地址和密码，点击［注册新用户］。</p>
<p><img alt="注册新用户" src="/assets/images/platform/prod_sign_up.png"></p>
<p>在商户类型选择页面选择［平台类型］。<br>
根据平台功能的用途选择是否共享客户信息。该设置只能在创建商户时选择，之后无法修改。<br>
点击［下一步］即可完成新用户注册，并创建平台类型商户。</p>
<p><img alt="选择商户类型" src="/assets/images/platform/platform_select_type.png"></p>
