<h1 id="請求先情報として顧客管理機能を利用する">使用客户管理功能管理账单收件方信息</h1>
<p>可使用 fincode 的标准客户管理功能，管理企业间支付的账单收件方信息。</p>
<p>客户记录中可保存名称、地址、电子邮件地址和电话号码等信息，也可关联卡片信息和银行账户自动扣款所用的账户信息进行管理。</p>
<p>是否须事先登记客户信息取决于所用的收费方式。</p>

<table><thead><tr><th>收费方式</th><th>是否须事先登记客户信息</th><th>详情</th></tr></thead><tbody>
<tr><td>邮件链接（重定向式支付 URL）</td><td>无需登记</td><td>通过邮件链接收费时不要求提供客户信息。提前登记可以省去收费时填写的步骤。</td></tr>
<tr><td>账单功能</td><td>须登记</td><td>使用账单功能收费前须登记客户信息。通过账单功能出具账单时，需要填写账单收件方的企业信息。如只需要在某一张账单修改客户信息，也可以仅在该账单中覆盖。</td></tr>
</tbody></table>
