<h1 id="制約事項">限制事项</h1>
<h2 id="テスト環境について">关于测试环境</h2>
<p>测试环境的行为可能与生产环境不同。<br>
测试环境可能在未事先通知的情况下变更或维护。<br>
请勿用于会产生大量请求的负载测试等。</p>
<h2 id="流量制御レート制限">流量控制与速率限制</h2>
<p>fincode 将每个商户的请求限制为每秒 5 次。</p>
<h2 id="タイムアウト">超时</h2>
<p>调用 API 时，建议将超时时间设置为 90 秒。该值考虑了发卡机构的授权处理时间。</p>
<h2 id="イベントログ">事件与日志</h2>
<p>控制面板中的事件与日志保留约 1 个月。<br>
超过 1 个月的数据可能会在未事先通知的情况下被删除。</p>
