<h1 id="インボイスの設定">账单设置</h1>
<p>账单功能的各种设置可在控制面板的商户设置中配置。</p>
<h2 id="適格請求書発行事業者登録番号の表示設定">设置是否显示日本合规发票开具企业登记编号</h2>
<p>可在控制面板的商户设置中隐藏账单功能显示的日本合规发票开具企业登记编号。<br>
设为隐藏后，之后签发的账单、收据和账单网页均不再显示该登记编号。</p>
<h2 id="インボイスに押印する社印の設定">设置账单上的公司印章</h2>
<p>可在控制面板的商户设置中登记用于在账单上盖章的公司印章图片。登记后，账单功能签发的账单、收据和账单网页均会带有公司印章。</p>
