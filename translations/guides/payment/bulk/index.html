<h1 id="一括決済とは">什么是批量支付</h1>
<p>批量支付可以集中登记和处理大量支付信息。通常每笔支付都需要调用一次 API，使用批量支付则可一次登记多笔支付，提高处理效率。</p>
<p>fincode 支持以下支付方式的批量支付。</p>

















<table><thead><tr><th align="left">支付方式</th><th align="left">说明</th></tr></thead><tbody><tr><td align="left"><a href="/payment/bulk/card">卡片</a></td><td align="left">对已登记卡片的客户批量执行授权。</td></tr><tr><td align="left"><a href="/payment/bulk/virtualaccount">银行转账（虚拟账户）</a></td><td align="left">批量签发虚拟账户并等待客户转账。</td></tr></tbody></table>
