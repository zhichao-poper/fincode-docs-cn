<h1 id="売上金額を確認する">查看销售金额</h1>
<h2 id="ダッシュボードで確認する">在控制面板查看</h2>
<p>可从控制面板查看已支付的销售金额。</p>
<p>在控制面板的侧栏菜单选择［销售款入账］。</p>
<p><img alt="销售款入账" src="/assets/images/tutorial/prod_sales_select.png"></p>
<p>选择所需的［销售款入账 ID］即可查看入账详情，包括转账日期、入账金额明细等。</p>
<p><img alt="销售款入账详情" src="/assets/images/tutorial/prod_sales_detail01.png"></p>
<p><img alt="销售款入账交易明细" src="/assets/images/tutorial/prod_sales_detail02.png"></p>
