<h1 id="テスト環境のapi情報接続情報を確認する">查看测试环境 API 信息及连接信息</h1>
<p>在 fincode 测试环境，登录控制面板后即可使用 API。</p>
<p>支付以测试模式执行，资金不会实际划转。<br>
开发时可以实际访问 API，并测试与生产环境相同的支付流程。</p>
<p>使用 API 还需要各商户各自的 API 密钥。<br>
可在控制面板查看测试环境使用的 API 密钥。</p>
<p><i class="icon-after icon-window"><a href="https://dashboard.test.fincode.jp/development/config" rel="[&#x27;nofollow&#x27;, &#x27;noopener&#x27;, &#x27;noreferrer&#x27;]" target="_blank">从控制面板获取 API 密钥</a></i></p>
