<h1 id="ダッシュボード">控制面板</h1>
<p>可以在控制面板通过图表查看销售款。<br>
可选择按日或按月显示，并按日期指定图表的查看范围。
<img alt="控制面板画面" src="../../assets/payment-guides/business_management/sales_graph_normal.png"></p>
<p><img alt="指定查看范围" src="../../assets/payment-guides/business_management/sales_graph_date.png"></p>
